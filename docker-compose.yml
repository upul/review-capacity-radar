services:
  db:
    image: postgres:16-alpine
    environment:
      # Local development credentials only.
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    env_file: .env  # GITHUB_TOKEN, LLM_API_KEY, LLM_MODEL, ...
    environment:
      # Inside Compose the database is the "db" service, not localhost.
      DATABASE_URL: postgresql+asyncpg://radar:radar@db:5432/radar
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
