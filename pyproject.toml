[project]
name = "capacity-radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Upul Bandara", email = "upul.bandara@airudi.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.145.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
capacity-radar = "capacity_radar:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # assert is how pytest tests are written

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
